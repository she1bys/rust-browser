# Publishes a release when a version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
# The tag must match `version` in Cargo.toml. It builds the browser, builds the
# installer with Inno Setup, and attaches both to a GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($tag -ne $version) { throw "Tag v$tag doesn't match Cargo.toml version $version" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          }
          $path = if ($iscc) { $iscc.Source } else { "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $path /Q "/DAppVersion=$env:VERSION" installer\rust-browser.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)" }

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target\installer\RustBrowser-Setup-$env:VERSION.exe" dist\
          Copy-Item target\release\rust-browser.exe "dist\rust-browser-$env:VERSION-portable.exe"
          # Hash first, then write: writing while listing would hash the sums file itself.
          $sums = Get-ChildItem dist -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          $sums | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $notes = @"
          **Install:** download ``RustBrowser-Setup-$env:VERSION.exe`` and run it. No administrator rights needed; it installs the Microsoft Edge WebView2 Runtime if your PC doesn't have it (Windows 10 and 11 usually do).

          **Portable:** ``rust-browser-$env:VERSION-portable.exe`` runs without installing (needs the WebView2 Runtime).

          Windows may show a SmartScreen warning because the app isn't code-signed yet: choose *More info* > *Run anyway*.
          "@
          gh release create "${{ github.ref_name }}" dist/* --title "Rust Browser $env:VERSION" --notes $notes --generate-notes
